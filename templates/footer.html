<footer class='bg-slate-200 p-4 flex justify-between items-center text-slate-600 border-t border-slate-300 shrink-0'> 
            <div class='flex items-center space-x-4'> 
                <div class='flex items-center text-xs space-x-2 font-bold'> 
                    <span id="db-status-dot" class='w-3 h-3 bg-green-500 rounded-full animate-pulse'></span> 
                    <span id="db-status-text">SINCRO DB: ATTIVA</span> 
                </div>
                <a href="{{ url_for('download_excel') }}" class='text-xs border-l border-slate-400 pl-4 hidden sm:flex items-center gap-2 text-slate-900 hover:text-emerald-700 transition-colors'> 
                    <span class="material-symbols-outlined text-base">download</span>
                    EXCEL: <span class='font-mono italic'>{{ excel_filename }}</span>
                </a> 
            </div> 
            <div class="flex space-x-2"> 
                <form action="{{ url_for('chiudi_sessione') }}" method="POST" onsubmit="return confirm('Confermi la chiusura della sessione?');">
                    <button type="submit" class="bg-slate-800 hover:bg-slate-900 text-white px-6 py-2 rounded font-bold uppercase text-xs transition-colors flex items-center gap-1.5 shadow-sm active:scale-95">
                        Chiudi Sessione
                    </button> 
                </form>
            </div>
</footer> 

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('searchInput');
            const items = document.querySelectorAll('.product-item');

            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase().trim();
                
                items.forEach(item => {
                    const name = item.getAttribute('data-name') || '';
                    if (name.includes(term)) {
                        item.style.display = '';
                    } else {
                        item.style.display = 'none';
                    }
                });
            });
        });
    </script>
    <script src="{{ url_for('static', filename='js/status_monitor.js') }}" defer></script>
</body>
</html>
