<footer class='bg-white border-t border-gray-100 px-6 py-2 flex justify-between items-center shrink-0'>
            <div class='flex items-center gap-4'>
                <div class='flex items-center text-xs gap-1.5 text-gray-400'>
                    <span id="db-status-dot" class='w-2 h-2 bg-green-400 rounded-full animate-pulse'></span>
                    <span id="db-status-text">DB sincronizzato</span>
                </div>
                <a href="{{ url_for('download_excel') }}" class='text-xs text-gray-400 hover:text-gray-600 transition-colors hidden sm:flex items-center gap-1.5 border-l border-gray-200 pl-4'>
                    <span class="material-symbols-outlined text-sm">download</span>
                    <span class='font-mono'>{{ excel_filename }}</span>
                </a>
            </div>
            <div class="flex">
                <form action="{{ url_for('chiudi_sessione') }}" method="POST" onsubmit="return confirm('Confermi la chiusura della sessione?');">
                    <button type="submit" class="bg-gray-100 hover:bg-gray-200 text-gray-600 px-4 py-1.5 rounded-md font-medium text-xs transition-colors">
                        Chiudi sessione
                    </button>
                </form>
            </div>
</footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('searchInput');
            const items = document.querySelectorAll('.product-item');

            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase().trim();
                
                items.forEach(item => {
                    const name = item.getAttribute('data-name') || '';
                    if (name.includes(term)) {
                        item.style.display = '';
                    } else {
                        item.style.display = 'none';
                    }
                });
            });
        });
    </script>
    <script src="{{ url_for('static', filename='js/status_monitor.js') }}" defer></script>
</body>
</html>
