{% include 'header.html' %}

        <main class='flex-1 p-6 overflow-y-auto w-full max-w-2xl mx-auto'>
            
            <section class='bg-white rounded-lg border border-gray-200 shadow-sm flex flex-col p-6'>
                <div class='border-b border-gray-100 pb-4 mb-6 shrink-0'>
                    <h2 class='font-semibold text-gray-800 text-xl'>Nuovo Carico Merce</h2>
                    <p class='text-sm text-gray-400 mt-1'>Registra un nuovo lotto in ingresso dal fornitore</p>
                </div>

                <form id="form-carico" action="{{ url_for('salva_carico') }}" method="POST" class="space-y-5">
                    
                    <div class="flex flex-col">
                        <label for="id_articolo" class="font-medium text-gray-600 mb-1.5 text-sm">Prodotto</label>
                        <select id="id_articolo" name="id_articolo" required class="p-3 border border-gray-300 rounded-lg bg-white focus:border-gray-500 focus:ring-0 focus:outline-none text-sm">
                            <option value="" disabled selected>Seleziona un prodotto…</option>
                            {% for categoria, articoli in articoli_per_categoria.items() %}
                                <optgroup label="{{ categoria }}">
                                    {% for art in articoli %}
                                        <option value="{{ art.id_articolo }}" data-categoria="{{ categoria }}">{{ art.denominazione }}</option>
                                    {% endfor %}
                                </optgroup>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="flex flex-col">
                            <label for="codice_lotto_fornitore" class="font-medium text-gray-600 mb-1.5 text-sm">Lotto Fornitore</label>
                            <input type="text" id="codice_lotto_fornitore" name="codice_lotto_fornitore" required
                                   maxlength="20" pattern="[A-Za-z0-9\-]+"
                                   title="Solo lettere, numeri e trattini, massimo 20 caratteri"
                                   placeholder="Es. L-123456"
                                   class="p-3 border border-gray-300 rounded-lg bg-white focus:border-gray-500 focus:ring-0 focus:outline-none text-sm">
                        </div>

                        <div class="flex flex-col">
                            <label for="fornitore" class="font-medium text-gray-600 mb-1.5 text-sm">Fornitore</label>
                            <input type="text" id="fornitore" name="fornitore" required placeholder="Es. Rossi Carni S.p.A." class="p-3 border border-gray-300 rounded-lg bg-white focus:border-gray-500 focus:ring-0 focus:outline-none text-sm">
                        </div>
                    </div>

                    <div class="flex flex-col">
                        <label for="data_scadenza" class="font-medium text-gray-600 mb-1.5 text-sm">Data di scadenza</label>
                        <input type="date" id="data_scadenza" name="data_scadenza" required class="p-3 border border-gray-300 rounded-lg bg-white focus:border-gray-500 focus:ring-0 focus:outline-none text-sm">
                    </div>

                    <!-- Sezione Dinamica Tracciabilità Carne (HACCP) -->
                    <div id="sezione-tracciabilita" class="hidden bg-blue-50/50 border-l-4 border-blue-400 rounded-r-lg p-5 space-y-4 transition-all">
                        <div class="flex items-center justify-between pb-3 border-b border-blue-100">
                            <div>
                                <h3 class="font-semibold text-blue-800 text-sm">Tracciabilità Carne · Dati HACCP</h3>
                                <p class="text-xs text-blue-500 mt-0.5">Obbligatori per carni fresche (Bovino, Suino, Avicolo)</p>
                            </div>
                            <span class="bg-blue-100 text-blue-700 text-xs font-semibold px-2 py-0.5 rounded-full">Obbligatorio</span>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div class="flex flex-col">
                                <label for="paese_nascita" class="font-medium text-gray-600 mb-1 text-xs">Nato in <span class="text-blue-500">*</span></label>
                                <input type="text" id="paese_nascita" name="paese_nascita" placeholder="Es. ITA" class="p-2.5 border border-gray-300 rounded-lg bg-white focus:border-blue-500 focus:ring-0 focus:outline-none text-sm">
                            </div>
                            <div class="flex flex-col">
                                <label for="paese_allevamento" class="font-medium text-gray-600 mb-1 text-xs">Allevato in <span class="text-blue-500">*</span></label>
                                <input type="text" id="paese_allevamento" name="paese_allevamento" placeholder="Es. ITA" class="p-2.5 border border-gray-300 rounded-lg bg-white focus:border-blue-500 focus:ring-0 focus:outline-none text-sm">
                            </div>
                            <div class="flex flex-col">
                                <label for="paese_macellazione" class="font-medium text-gray-600 mb-1 text-xs">Macellato in <span class="text-blue-500">*</span></label>
                                <input type="text" id="paese_macellazione" name="paese_macellazione" placeholder="Es. ITA o IT-123" class="p-2.5 border border-gray-300 rounded-lg bg-white focus:border-blue-500 focus:ring-0 focus:outline-none text-sm">
                            </div>
                            <div class="flex flex-col">
                                <label for="paese_sezionamento" class="font-medium text-gray-600 mb-1 text-xs">Sezionato in <span class="text-blue-500">*</span></label>
                                <input type="text" id="paese_sezionamento" name="paese_sezionamento" placeholder="Es. ITA o IT-456" class="p-2.5 border border-gray-300 rounded-lg bg-white focus:border-blue-500 focus:ring-0 focus:outline-none text-sm">
                            </div>
                        </div>

                        <div class="flex flex-col pt-2 border-t border-blue-100">
                            <label for="data_macellazione" class="font-medium text-gray-600 mb-1 text-xs">Data macellazione</label>
                            <input type="date" id="data_macellazione" name="data_macellazione" class="p-2.5 border border-gray-300 rounded-lg bg-white focus:border-blue-500 focus:ring-0 focus:outline-none text-sm">
                            <span class="text-xs text-gray-400 mt-1">Obbligatoria se non è specificata la data di scadenza.</span>
                        </div>
                    </div>

                    <div class="pt-2">
                        <button type="submit" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-semibold text-sm py-3 rounded-lg transition-colors shadow-sm">
                            Salva Carico Merce
                        </button>
                    </div>
                </form>

            </section>

        </main>

        <script>
            document.addEventListener('DOMContentLoaded', function() {
                const selectArticolo = document.getElementById('id_articolo');
                const sezioneTracciabilita = document.getElementById('sezione-tracciabilita');
                const inputScadenza = document.getElementById('data_scadenza');
                const inputMacellazione = document.getElementById('data_macellazione');
                const countryInputs = [
                    document.getElementById('paese_nascita'),
                    document.getElementById('paese_allevamento'),
                    document.getElementById('paese_macellazione'),
                    document.getElementById('paese_sezionamento')
                ];
                
                const categorieCarne = ['bovino', 'suino', 'avicolo'];

                function aggiornaVisibilitaTracciabilita() {
                    const selectedOption = selectArticolo.options[selectArticolo.selectedIndex];
                    const categoria = (selectedOption && selectedOption.dataset.categoria) ? selectedOption.dataset.categoria.toLowerCase().trim() : '';
                    const isCarne = categorieCarne.includes(categoria);

                    if (isCarne) {
                        sezioneTracciabilita.classList.remove('hidden');
                        countryInputs.forEach(input => {
                            input.required = true;
                        });
                        inputScadenza.required = false;
                    } else {
                        sezioneTracciabilita.classList.add('hidden');
                        countryInputs.forEach(input => {
                            input.required = false;
                            input.value = '';
                        });
                        inputMacellazione.value = '';
                        inputScadenza.required = true;
                    }
                }

                selectArticolo.addEventListener('change', aggiornaVisibilitaTracciabilita);

                // Esegui all'avvio per allineare lo stato iniziale
                aggiornaVisibilitaTracciabilita();

                // Validazione client-side prima del submit
                const form = document.getElementById('form-carico');
                if (form) {
                    form.addEventListener('submit', function(e) {
                        const selectedOption = selectArticolo.options[selectArticolo.selectedIndex];
                        const categoria = (selectedOption && selectedOption.dataset.categoria) ? selectedOption.dataset.categoria.toLowerCase().trim() : '';
                        const isCarne = categorieCarne.includes(categoria);

                        if (isCarne) {
                            if (!inputScadenza.value && !inputMacellazione.value) {
                                e.preventDefault();
                                alert('Per le categorie carni è obbligatorio inserire almeno una data tra Data Macellazione e Data di Scadenza.');
                                inputMacellazione.focus();
                                return false;
                            }
                        }
                    });
                }
            });
        </script>

{% include 'footer.html' %}
